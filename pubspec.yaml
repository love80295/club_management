name: club_management
description: "University Club Management App - Connect students with clubs, manage events, and track participation."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  
  # Remove font_awesome_flutter - we'll use Material Icons instead

  # Local Storage
  shared_preferences: ^2.2.2
  
  # Networking
  http: ^1.1.0
  
  # Image Picker
  image_picker: ^1.0.4
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.1.14
  
  # State Management
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true